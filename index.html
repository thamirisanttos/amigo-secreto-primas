<style>
:root{
  --pink:#FF8FB1; --mint:#9BE7D6; --butter:#FFE27A; --lilac:#B9A6FF; --peach:#FFB36B;
  --ink:#34405F; --muted:#6B7390;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--ink);
  background:linear-gradient(160deg,#FFF0F6 0%,#EAFBF6 55%,#FFF8E1 100%);
  overflow:hidden;
}
.screen{
  position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  padding:24px;padding-top:max(24px,env(safe-area-inset-top));
  padding-bottom:max(24px,env(safe-area-inset-bottom));
  overflow-y:auto;
}
.screen.active{display:flex;animation:fadeIn .6s ease both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* Tela 1: formulário */
.card{
  width:100%;max-width:380px;background:#fff;border-radius:24px;padding:28px 24px;
  box-shadow:0 12px 32px rgba(52,64,95,.08);
}
.card h1{font-size:22px;margin:0 0 4px;color:var(--ink)}
.card p.sub{margin:0 0 18px;font-size:14px;color:var(--muted)}
label{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
input{
  width:100%;padding:13px 14px;border:2px solid #E7EBF6;border-radius:14px;
  font-size:16px;font-family:inherit;color:var(--ink);background:#fff;outline:none;
  transition:border-color .2s, box-shadow .2s;
}
input:focus{border-color:var(--lilac);box-shadow:0 0 0 4px rgba(185,166,255,.25)}
input.invalid{border-color:#FF6B8B;box-shadow:0 0 0 4px rgba(255,107,139,.18);animation:shake .35s}
@keyframes shake{
  0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}
}
.msg{display:none;color:#E0456B;font-size:13px;margin-top:6px}
.msg.show{display:block}
.cta{
  margin-top:22px;width:100%;padding:15px;border:0;border-radius:999px;cursor:pointer;
  font-size:17px;font-weight:700;font-family:inherit;color:#fff;
  background:linear-gradient(90deg,var(--pink),var(--lilac));
  box-shadow:0 10px 22px rgba(255,143,177,.45);
  transition:transform .15s ease;
}
.cta:active{transform:scale(.98)}
.cta:disabled{opacity:.8;cursor:default}

/* Tela 2: revelação */
#reveal{background:linear-gradient(160deg,var(--pink),var(--lilac) 60%,var(--mint))}
.bubble{
  font-family:"Lilita One",system-ui,sans-serif;font-weight:700;
  color:var(--butter);text-align:center;line-height:1.15;
  font-size:clamp(34px,9vw,52px);
  text-shadow:0 3px 0 #E39A2B,0 6px 0 #C2741F,0 10px 18px rgba(60,30,80,.35);
  margin:0;animation:pop .7s cubic-bezier(.2,1.6,.4,1) both;
}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}

/* Tela 3: mensagem final */
#final{background:#FFFBF4}
.letter{width:100%;max-width:380px;text-align:center}
.frase{
  font-family:"Schoolbell",cursive;color:var(--ink);
  font-size:30px;line-height:1.3;margin:0 0 22px;min-height:4em;
  text-shadow:0 1px 0 rgba(52,64,95,.12);
}
.caret{display:inline-block;width:2px;height:1em;background:var(--ink);margin-left:2px;vertical-align:-3px;animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.photo{
  background:#fff;border-radius:18px;overflow:hidden;opacity:0;transform:translateY(16px) scale(.97);
  box-shadow:0 12px 30px rgba(52,64,95,.15);transition:opacity .9s ease, transform .9s ease;
}
.photo.in{opacity:1;transform:none}
.photo img{display:block;width:100%;height:auto}
.legenda{
  font-family:"Schoolbell",cursive;color:var(--ink);font-size:28px;
  padding:10px 12px 14px;background:#fff;
}
.legenda.hidden{visibility:hidden}

canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.som{position:fixed;right:16px;bottom:max(16px,env(safe-area-inset-bottom));z-index:60;width:48px;height:48px;border-radius:50%;border:0;background:#fff;box-shadow:0 6px 16px rgba(52,64,95,.2);font-size:22px;cursor:pointer;display:none}
.som.on{display:block}
</style>
</head>
<body>

<!-- TELA 1 -->
<section class="screen active" id="form">
  <div class="card">
    <h1>Sorteio de amigo secreto</h1>
    <p class="sub">Preencha seus dados para participar.</p>

    <label for="nome">Nome</label>
    <input id="nome" type="text" autocomplete="name" placeholder="Seu nome">
    <div class="msg" id="nome-msg">Preencha este campo para continuar</div>

    <label for="tel">Telefone</label>
    <input id="tel" type="tel" autocomplete="tel" placeholder="(00) 00000-0000">
    <div class="msg" id="tel-msg">Preencha este campo para continuar</div>

    <label for="email">E-mail</label>
    <input id="email" type="email" autocomplete="email" placeholder="voce@exemplo.com">
    <div class="msg" id="email-msg">Preencha este campo para continuar</div>

    <button class="cta" id="seguir">Seguir</button>
  </div>
</section>

<!-- TELA 2 -->
<section class="screen" id="reveal">
  <h2 class="bubble">Seu amigo secreto é...</h2>
</section>

<!-- TELA 3 -->
<section class="screen" id="final">

<canvas id="fx"></canvas>

<script>
const $ = id => document.getElementById(id);
const campos = ['nome', 'tel', 'email'];

/* ---------- Validação ---------- */
campos.forEach(id => {
  $(id).addEventListener('input', () => {
    $(id).classList.remove('invalid');
    $(id + '-msg').classList.remove('show');
  });
});

function validar() {
  let primeiro = null;
  let ok = true;
  campos.forEach(id => {
    const v = $(id).value.trim();
    const vazio = !v;
    const emailInvalido = id === 'email' && !vazio && !/^\S+@\S+\.\S+$/.test(v);
    const erro = vazio || emailInvalido;
    const msg = $(id + '-msg');
    msg.textContent = vazio ? 'Preencha este campo para continuar' : 'Digite um e-mail válido';
    $(id).classList.toggle('invalid', erro);
    msg.classList.toggle('show', erro);
    if (erro) { ok = false; if (!primeiro) primeiro = $(id); }
  });
  if (primeiro) primeiro.focus();
  return ok;
}

/* ---------- Telas ---------- */
function mostrar(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
  $(id).scrollTop = 0;
}

/* ---------- Confete e brilho ---------- */
const canvas = $('fx');
const ctx = canvas.getContext('2d');
const cores = ['#FF8FB1', '#FFE27A', '#9BE7D6', '#B9A6FF', '#FFB36B', '#FFFFFF'];
let particulas = [];
let rodando = false;

function ajustarCanvas() {
  canvas.width = window.innerWidth * devicePixelRatio;
  canvas.height = window.innerHeight * devicePixelRatio;
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
}
ajustarCanvas();
window.addEventListener('resize', ajustarCanvas);

function explodir(x, y, n = 90) {
  for (let i = 0; i < n; i++) {
    const ang = Math.random() * Math.PI * 2;
    const vel = 3 + Math.random() * 9;
    particulas.push({
      x, y,
      vx: Math.cos(ang) * vel,
      vy: Math.sin(ang) * vel - 3,
      tam: 4 + Math.random() * 6,
      cor: cores[Math.floor(Math.random() * cores.length)],
      rot: Math.random() * 6,
      vr: (Math.random() - .5) * .3,
      brilho: Math.random() < .4,
      vida: 1
    });
  }
  if (!rodando) { rodando = true; animar(); }
}

function animar() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particulas.forEach(p => {
    p.vy += .18; p.vx *= .985; p.vy *= .985;
    p.x += p.vx; p.y += p.vy; p.rot += p.vr;
    p.vida -= .011;
    ctx.save();
    ctx.globalAlpha = Math.max(p.vida, 0);
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    if (p.brilho) {
      ctx.fillStyle = '#fff';
      ctx.shadowColor = p.cor;
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(0, 0, p.tam * .45, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillStyle = p.cor;
      ctx.fillRect(-p.tam / 2, -p.tam / 4, p.tam, p.tam / 2);
    }
    ctx.restore();
  });
  particulas = particulas.filter(p => p.vida > 0 && p.y < window.innerHeight + 40);
  if (particulas.length) requestAnimationFrame(animar);
  else { rodando = false; ctx.clearRect(0, 0, canvas.width, canvas.height); }
}

function chuvaAleatoria(ms, intervalo) {
  const fim = Date.now() + ms;
  const t = setInterval(() => {
    if (Date.now() > fim) return clearInterval(t);
    explodir(Math.random() * window.innerWidth, Math.random() * window.innerHeight * .6, 50);
  }, intervalo);
}

/* ---------- Sequência ---------- */
$('seguir').addEventListener('click', () => {
  if (!validar()) return;
  prepararAudio();

  const btn = $('seguir');
  btn.disabled = true;
  btn.textContent = 'Sorteando...';

  const r = btn.getBoundingClientRect();
  explodir(r.left + r.width / 2, r.top + r.height / 2, 140);
  chuvaAleatoria(2600, 260);

  setTimeout(() => {
    mostrar('reveal');
    chuvaAleatoria(2600, 700);
  }, 2600);

  setTimeout(mostrar.bind(null, 'final'), 5600);
  setTimeout(digitar, 6200);
});

/* ---------- Batimentos cardíacos (sintetizados) ---------- */
let batendo = false;
let somLigado = true;

function prepararAudio() {
  const som = $('coracao');
  som.play().then(() => som.pause()).catch(() => {});
}

function iniciarBatimentos() {
  if (batendo) return;
  batendo = true;
  const som = $('coracao');
  $('som').classList.add('on');
  som.currentTime = 0;
  if (somLigado) som.play().catch(() => {});
}

$('som').addEventListener('click', () => {
  somLigado = !somLigado;
  $('som').textContent = somLigado ? '🔊' : '🔇';
  const som = $('coracao');
  if (somLigado && batendo) som.play().catch(() => {});
  else som.pause();
});

/* ---------- Máquina de escrever ---------- */
const nomeUsuario = () => $('nome').value.trim();

function digitar() {
  const texto = 'Titia ' + nomeUsuario() + ', prepare o coração e o colinho pois estou a caminho!';
  const frase = $('frase');
  const caret = $('caret');
  let i = 0;
  const t = setInterval(() => {
    i++;
    frase.textContent = texto.slice(0, i);
    frase.appendChild(caret);
    if (i >= texto.length) {
      clearInterval(t);
      setTimeout(mostrarFoto, 500);
    }
  }, 45);
}

function mostrarFoto() {
  $('photo').classList.add('in');
  iniciarBatimentos();
  setTimeout(() => $('legenda').classList.remove('hidden'), 900);
  setTimeout(() => $('caret').remove(), 400);
}
</script>
